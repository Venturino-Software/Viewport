name: Generar Paquetes y Publicar Repos (APT y Pacman)

on:
  push:
    branches:
      - "main"    # → unstable
      - "stable"  # → stable

permissions:
  contents: write

jobs:
  deploy-repos:
    runs-on: ubuntu-22.04

    env:
      CODENAME: ${{ github.ref_name == 'main' && 'unstable' || github.ref_name }}
      DEB_SUFFIX: ${{ github.ref_name == 'main' && 'unstable' || 'stable' }}

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
                                  libgl1-mesa-dev libxkbcommon-dev \
                                  libvulkan-dev libdbus-1-dev reprepro libasound2-dev qml6-module-qtmultimedia

      - name: Instalar Qt 6.4.2 (Ubuntu)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'
          aqtversion: '==3.1.5'
          modules: 'qt5compat qtmultimedia'

      - name: Compilar Viewport para Debian
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.qt_prefix }}
          cmake --build build

      - name: Crear y empaquetar .deb
        run: |
          mkdir -p debian_package/vpt/bin
          mkdir -p debian_package/DEBIAN

          cp build/appvpt01 debian_package/vpt/bin/viewport
          cp Main.qml debian_package/vpt/bin/
          cp StyledPopup.qml debian_package/vpt/bin/
          cp StyledButton.qml debian_package/vpt/bin/
          cp FontManager.qml debian_package/vpt/bin/
          cp nunito.ttf debian_package/vpt/bin/
          cp nunitor.ttf debian_package/vpt/bin/
          cp changaone.ttf debian_package/vpt/bin/
          cp FirstStart.qml debian_package/vpt/bin/
          cp CommandPill.qml debian_package/vpt/bin/
          cp azaretmono.ttf debian_package/vpt/bin/
          cp -r src debian_package/vpt/bin/
          cp orbit.png debian_package/vpt/bin/

          VERSION="1.0.${{ github.run_number }}"

          cat <<EOF > debian_package/DEBIAN/control
          Package: viewport
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: VNT <zeus.ruffo@icloud.com>
          Depends: libqt6core6, libqt6gui6, libqt6qml6, libqt6quick6, libqt6core5compat6, qml6-module-qtquick-controls, qml6-module-qtquick-layouts, qml6-module-qtquick-shapes, qml6-module-qt5compat-graphicaleffects, libasound2
          Recommends: fonts-nunito
          Description: Entorno grafico ultraligero y ultracustomizable.
          EOF

          dpkg-deb --build debian_package viewport_${DEB_SUFFIX}.deb
          mv viewport_${DEB_SUFFIX}.deb /tmp/viewport.deb

      - name: Compilar y empaquetar para Arch Linux (Docker)
        run: |
          docker run --rm -v ${{ github.workspace }}:/work archlinux:base-devel /bin/bash -c "
            pacman -Syu --noconfirm &&
            pacman -S --noconfirm cmake ninja qt6-base qt6-declarative qt6-multimedia qt6-5compat sudo &&
            useradd -m builduser &&
            cp -r /work /home/builduser/src_code &&
            chown -R builduser:builduser /home/builduser/src_code &&
            cd /home/builduser/src_code &&
            sudo -u builduser bash -c '
              cat <<EOF > PKGBUILD
          pkgname=viewport
          pkgver=1.0.${{ github.run_number }}
          pkgrel=1
          pkgdesc=\"Entorno grafico ultraligero y ultracustomizable.\"
          arch=(\"x86_64\")
          depends=(\"qt6-base\" \"qt6-declarative\" \"qt6-multimedia\" \"qt6-5compat\" \"alsa-lib\")
          makedepends=(\"cmake\" \"ninja\")
          build() {
            cmake -B build_arch -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build_arch
          }
          package() {
            mkdir -p \\\$pkgdir/opt/viewport/bin
            cp build_arch/appvpt01 \\\$pkgdir/opt/viewport/bin/viewport
            cp Main.qml \\\$pkgdir/opt/viewport/bin/
            cp StyledPopup.qml \\\$pkgdir/opt/viewport/bin/
            cp StyledButton.qml \\\$pkgdir/opt/viewport/bin/
            cp FontManager.qml \\\$pkgdir/opt/viewport/bin/
            cp nunito.ttf \\\$pkgdir/opt/viewport/bin/
            cp nunitor.ttf \\\$pkgdir/opt/viewport/bin/
            cp changaone.ttf \\\$pkgdir/opt/viewport/bin/
            cp FirstStart.qml \\\$pkgdir/opt/viewport/bin/
            cp CommandPill.qml \\\$pkgdir/opt/viewport/bin/
            cp azaretmono.ttf \\\$pkgdir/opt/viewport/bin/
            cp -r src \\\$pkgdir/opt/viewport/bin/
            cp orbit.png \\\$pkgdir/opt/viewport/bin/

            mkdir -p \\\$pkgdir/usr/bin
            ln -s /opt/viewport/bin/viewport \\\$pkgdir/usr/bin/viewport
          }
          EOF
              makepkg -s --noconfirm
            ' &&
            cp /home/builduser/src_code/viewport-*.pkg.tar.zst /work/
          "
          mv viewport-*.pkg.tar.zst /tmp/

      - name: Configurar, firmar y publicar repositorios (APT y Pacman)
        run: |
          git fetch origin
          git checkout gh-pages || git checkout --orphan gh-pages

          # --- DEBIAN APT REPO ---
          mkdir -p conf
          cat <<EOF > conf/distributions
          Origin: Viewport Repository
          Label: Viewport Unstable
          Codename: unstable
          Suite: unstable
          Architectures: amd64
          Components: main
          Description: Repositorio inestable para Viewport

          Origin: Viewport Repository
          Label: Viewport Stable
          Codename: stable
          Suite: stable
          Architectures: amd64
          Components: main
          Description: Repositorio estable para Viewport
          EOF

          reprepro -b . includedeb ${CODENAME} /tmp/viewport.deb
          reprepro -b . export
          reprepro -b . clearvanished
          reprepro -b . createsymlinks

          cd dists/${CODENAME}
          md5sum main/binary-amd64/Packages.gz > /tmp/check_md5
          if ! grep -q "$(cat /tmp/check_md5)" Release; then
            echo "⚠️ Regenerando Release manualmente para ${CODENAME}"
            cd ../..
            reprepro -b . export
          else
            cd ../..
          fi

          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --detach-sign --armor \
            --output dists/${CODENAME}/Release.gpg \
              dists/${CODENAME}/Release

          gpg --armor --export > publickey.asc
          echo "vpt.soyss.cc" > CNAME

          # --- ARCH LINUX REPO ---
          # Utilizamos un contenedor de Arch para poder ejecutar repo-add sobre la rama gh-pages
          docker run --rm -v ${{ github.workspace }}:/work -v /tmp:/tmp archlinux:base-devel /bin/bash -c "
            cd /work &&
            mkdir -p arch/${CODENAME}/os/x86_64 &&
            cp /tmp/viewport*.pkg.tar.zst arch/${CODENAME}/os/x86_64/ &&
            repo-add arch/${CODENAME}/os/x86_64/viewport.db.tar.gz arch/${CODENAME}/os/x86_64/viewport*.pkg.tar.zst
          "

          # --- COMMIT Y PUSH FINAL ---
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add --all
          git commit -m "🔧 Repos ${CODENAME}: v${{ github.run_number }} (APT firmado + Arch pacman)"
          git push origin gh-pages --force
