name: Generar Paquete DEB (>unstable)

on:
  push:
    branches:
      - "main" # Se ejecuta solo cuando lanzas algo definitivo a main

permissions:
  contents: write

jobs:
  deploy-apt-repo:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          # Agregamos reprepro a esta lista:
          sudo apt-get install -y build-essential cmake ninja-build \
                                  libgl1-mesa-dev libxkbcommon-dev \
                                  libvulkan-dev libdbus-1-dev reprepro

      - name: Instalar Qt 6.4.2
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'
          aqtversion: '==3.1.5'
          modules: 'qt5compat'
          
      - name: Compilar Viewport (appvpt01)
        run: |
          # Aquí le decimos a CMake: "busca Qt en la ruta que guardó el paso 'qt'"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.qt_prefix }}
          
          # Compila el binario
          cmake --build build

      - name: Crear y empaquetar .deb
        run: |
          mkdir -p debian_package/vpt/bin
          mkdir -p debian_package/DEBIAN

          # NEW: for ATP
          cp build/appvpt01 debian_package/vpt/bin/viewport
          # ¡Copiar los archivos QML!
          cp Main.qml debian_package/vpt/bin/
          cp StyledPopup.qml debian_package/vpt/bin/
          cp StyledButton.qml debian_package/vpt/bin/
          cp FontManager.qml debian_package/vpt/bin/
          cp nunito.ttf debian_package/vpt/bin/
          cp nunitor.ttf debian_package/vpt/bin/
          cp changaone.ttf debian_package/vpt/bin/
          cp FirstStart.qml debian_package/vpt/bin/
          
          # Si no hay etiqueta, usamos el número de ejecución
          VERSION="1.0.${{ github.run_number }}"
          
          # Usamos cat sin comillas en EOF para que se expandan las variables
          cat <<EOF > debian_package/DEBIAN/control
          Package: viewport
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: VNT <zeus.ruffo@icloud.com>
          Depends: libqt6core6, libqt6gui6, libqt6qml6, libqt6quick6, libqt6core5compat6, qml6-module-qtquick-controls, qml6-module-qtquick-layouts, qml6-module-qtquick-shapes, qml6-module-qt5compat-graphicaleffects
          Recommends: fonts-nunito
          Description: Entorno grafico ultraligero y ultracustomizable.
          EOF
          
          # Construimos y movemos inmediatamente a /tmp (ruta absoluta, segura)
          dpkg-deb --build debian_package viewport_unstable.deb
          mv viewport_unstable.deb /tmp/viewport.deb

            - name: Configurar, firmar y publicar repositorio APT
        run: |
          # Preparar rama gh-pages
          git fetch origin
          git checkout gh-pages || git checkout --orphan gh-pages

          # Limpiar todo el contenido excepto .git para evitar borrar el repositorio
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} \;
          rm -rf /tmp/reprepro_temp
          mkdir -p conf

          # Configuración de reprepro
          cat <<EOF > conf/distributions
          Origin: Viewport Repository
          Label: Viewport APT
          Codename: unstable
          Architectures: amd64
          Components: main
          Description: Repositorio inestable para Viewport
          EOF

          # Construir el índice del repositorio
          reprepro -b . clearvanished
          # CORREGIDO: deleteunmatched seguido del codename (sin --delete)
          reprepro -b . deleteunmatched unstable
          reprepro -b . includedeb unstable /tmp/viewport.deb
          reprepro -b . export
          reprepro -b . createsymlinks
          reprepro -b . gensymbols

          # Verificar hash de Packages.gz y reexportar si es necesario
          cd dists/unstable
          md5sum main/binary-amd64/Packages.gz > /tmp/check_md5
          if ! grep -q "$(cat /tmp/check_md5)" Release; then
            echo "⚠️ Regenerando Release manualmente"
            cd ../..
            reprepro -b . export
          else
            cd ../..
          fi

          # --- Importar clave GPG y firmar Release ---
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --detach-sign --armor \
              --output dists/unstable/Release.gpg \
              dists/unstable/Release
          # ------------------------------------------------

          echo "vpt.soyss.cc" > CNAME
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add --all
          git commit -m "🔧 APT: v${{ github.run_number }} (firmado)"
          git push origin gh-pages --force
